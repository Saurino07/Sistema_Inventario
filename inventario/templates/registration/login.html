<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="card-body text-center">
        <div class="mb-3 text-primary">
            <i class="fa-solid fa-shield-halved fa-3x"></i>
        </div>
        <h4 class="fw-bold mb-1">Plataforma TI</h4>
        <p class="text-muted small mb-4">Ingresa tus credenciales para continuar</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Usuario" required>
                <label for="id_username">Usuario</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Contraseña" required>
                <label for="id_password">Contraseña</label>
            </div>
            <button class="btn btn-primary w-100 py-2 font-weight-bold" type="submit">Iniciar Sesión</button>
        </form>
    </div>
</div>
</body>
</html>
