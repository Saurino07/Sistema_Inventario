{% extends 'inventario/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-custom p-4">
            <div class="card-body">
                <div class="d-flex align-items-center mb-4">
                    <a href="{% url 'lista_articulos' %}" class="btn btn-light me-3">
                        <i class="fa-solid fa-arrow-left"></i> Volver
                    </a>
                    <h3 class="card-title mb-0">{{ titulo }}</h3>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-weight-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg shadow-sm">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Guardar en Inventario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
