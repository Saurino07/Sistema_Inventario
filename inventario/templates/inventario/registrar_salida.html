<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Salida de Artículo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .form-card { background: white; padding: 25px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Registrar Salida de: {{ articulo.nombre }}</h2>
    <p><strong>Código:</strong> {{ articulo.codigo_patrimonial }}</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="recibe_nombre">Nombre de la persona que recibe:</label>
            <input type="text" id="recibe_nombre" name="recibe_nombre" required>
        </div>

        <div class="form-group">
            <label for="recibe_departamento">Departamento / Área:</label>
            <input type="text" id="recibe_departamento" name="recibe_departamento" required>
        </div>

        <div class="form-group">
            <label for="recibe_puesto">Puesto:</label>
            <input type="text" id="recibe_puesto" name="recibe_puesto">
        </div>

        <div class="form-group">
            <label for="motivo_salida">Motivo / Observaciones:</label>
            <textarea id="motivo_salida" name="motivo_salida" rows="3" required></textarea>
        </div>

        <button type="submit">Generar Responsiva PDF y Procesar Salida</button>
    </form>
</div>

</body>
</html>
