<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma TI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sidebar-width: 250px; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: #0f172a; color: #fff; z-index: 100; }
        .main-content { margin-left: var(--sidebar-width); padding: 2rem; }
        .nav-link-custom { color: #94a3b8; padding: 0.75rem 1rem; border-radius: 8px; display: flex; align-items: center; text-decoration: none; margin-bottom: 0.25rem; }
        .nav-link-custom:hover, .nav-link-custom.active { background-color: #1e293b; color: #38bdf8; }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <div class="d-flex align-items-center mb-4 px-2 text-white">
        <i class="fa-solid fa-server fa-lg text-info me-2"></i>
        <span class="fs-5 fw-bold">Gestión TI</span>
    </div>
    <hr class="text-secondary">
    <nav>
        <a href="{% url 'lista_articulos' %}" class="nav-link-custom active">
            <i class="fa-solid fa-boxes-stacked me-3"></i> Inventario
        </a>
        <a href="{% url 'historial_responsivas' %}" class="nav-link-custom">
            <i class="fa-solid fa-people-carry-box me-3"></i> Equipos Asignados
        </a>
    </nav>
    <div class="position-absolute bottom-0 start-0 w-100 p-3">
        <div class="d-flex align-items-center justify-content-between text-muted border-top border-secondary pt-3">
            <span class="small"><i class="fa-solid fa-user me-1"></i> {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm" title="Cerrar Sesión">
                <i class="fa-solid fa-power-off"></i>
            </a>
        </div>
    </div>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
