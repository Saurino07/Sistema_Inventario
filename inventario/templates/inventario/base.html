<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestión TI{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS (Diseño Profesional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .sidebar { background-color: #ffffff; min-height: calc(100vh - 56px); border-right: 1px solid #dee2e6; }
        .nav-link { color: #495057; font-weight: 500; border-radius: 6px; margin-bottom: 4px; }
        .nav-link:hover, .nav-link.active { background-color: #e9ecef; color: #0d6efd; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'lista_articulos' %}">
                <i class="fa-solid fa-laptop-code me-2"></i>Plataforma de Gestión TI
            </a>
            <span class="navbar-text text-white small">
                <i class="fa-solid fa-user me-1"></i> {{ user.username|default:"Usuario TI" }}
            </span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral (Pensado para crecer en módulos) -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-2 mb-3 text-muted text-uppercase fs-7">
                    <span>Módulos</span>
                </h6>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'lista_articulos' %}">
                            <i class="fa-solid fa-boxes-stacked me-2"></i> Inventario TI
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'historial_responsivas' %}">
                            <i class="fa-solid fa-file-contract me-2"></i> Historial Responsivas
                        </a>
                    </li>
                    <!-- En el futuro aquí agregarás más módulos fácilmente -->
                    <li class="nav-item">
                        <a class="nav-link text-muted disabled" href="#">
                            <i class="fa-solid fa-headset me-2"></i> Soporte (Próximamente)
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Contenido Principal Dinámico -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}
                <!-- Aquí se cargará cada página del sistema -->
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
